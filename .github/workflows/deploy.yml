name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Garante que apenas um deploy roda por vez — o mais recente cancela o anterior.
# Como usamos git push (não a API de Pages), não há problema de lock no CDN.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy para branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          # Não processa Jekyll — serve os arquivos estáticos diretamente
          enable_jekyll: false
          # Exclui arquivos desnecessários do site publicado
          exclude_assets: '.github,.git,*.md'
