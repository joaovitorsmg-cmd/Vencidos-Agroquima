name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Only one Pages deployment runs at a time — new pushes queue instead of racing.
# cancel-in-progress: false prevents the "Deployment failed, try again later" error
# that occurs when a deployment is cancelled mid-flight and leaves an orphaned lock.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
